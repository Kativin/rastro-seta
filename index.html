<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rastro Seta</title>
<meta name="theme-color" content="#2b3a2c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rastro Seta">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{--crema:#f4efe3;--bosque:#2b3a2c;--teja:#c8553d;--ocre:#2ee65a}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;background:#1d2a1f;color:var(--bosque)}
  #map{position:absolute;inset:0}
  .trail-pane{opacity:.45}
  .panel{background:rgba(244,239,227,.95);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  #compass{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:1000;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px}
  #rose{width:46px;height:46px;flex:none}
  #coords{font:600 12px/1.35 ui-monospace,Menlo,monospace}
  #coords small{font:500 11px system-ui;opacity:.7}
  #status{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:1000;padding:6px 10px;font-size:12px;text-align:right;line-height:1.4}
  #bar{position:absolute;left:0;right:0;bottom:0;z-index:1000;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;
       padding:10px 8px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.55))}
  #bar button{border:0;border-radius:14px;padding:11px 12px;font-size:14px;font-weight:600;background:var(--crema);color:var(--bosque);box-shadow:0 2px 8px rgba(0,0,0,.3)}
  #bar button.on{background:var(--teja);color:#fff}
  #toast{position:absolute;top:calc(74px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:1001;background:var(--teja);color:#fff;border-radius:12px;padding:8px 14px;font-size:14px;display:none;white-space:nowrap}
  .arrow{width:34px;height:34px;will-change:transform}
  .seta{position:relative;font-size:28px;line-height:28px;text-align:center;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
  .seta b{position:absolute;right:-6px;top:-6px;background:var(--bosque);color:#fff;font:700 10px system-ui;border-radius:9px;min-width:16px;height:16px;line-height:16px;padding:0 3px}
  /* Modal */
  #modal{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
  #modal.show{display:flex}
  #sheet{background:var(--crema);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-sizing:border-box}
  #sheet h3{margin:0 0 12px;font-size:18px}
  #sheet label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
  #sheet select,#sheet input,#sheet textarea{width:100%;box-sizing:border-box;font-size:16px;padding:10px;border:1px solid #c9bfa8;border-radius:10px;background:#fff;color:var(--bosque);font-family:inherit}
  #sheet .meta{font-size:13px;background:#e9e2d0;border-radius:10px;padding:8px 10px;margin-top:4px;line-height:1.5}
  #sheet .row{display:flex;gap:8px;margin-top:16px}
  #sheet .row button{flex:1;border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:600}
  .bOk{background:var(--bosque);color:#fff}.bDel{background:var(--teja);color:#fff}.bNo{background:#ddd3bd;color:var(--bosque)}
  #report{display:none}
  .mModal{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
  .mModal.show{display:flex}
  .sheet2{background:var(--crema);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-sizing:border-box}
  .sheet2 h3{margin:0 0 6px}
  .sheet2 .col{display:flex;flex-direction:column;gap:8px}
  #carChip{position:absolute;top:calc(66px + env(safe-area-inset-top));right:10px;z-index:1000;display:none;align-items:center;gap:6px;padding:5px 10px 5px 5px;font:600 13px system-ui}
  #carArrow{width:26px;height:26px}
  .stGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stGrid div{background:#e9e2d0;border-radius:12px;padding:10px}
  .stGrid b{display:block;font-size:20px}
  .stGrid span{font-size:12px;opacity:.75}
  .spList{margin:12px 0 0;padding:0;list-style:none;font-size:14px}
  .spList li{display:flex;justify-content:space-between;border-bottom:1px solid #ddd3bd;padding:6px 2px}
  .hItem{background:#e9e2d0;border-radius:12px;padding:10px;margin-bottom:8px;font-size:14px}
  .hItem.cur{outline:3px solid var(--bosque)}
  .hItem .hb{display:flex;gap:6px;margin-top:8px}
  .hItem .hb button{flex:1;padding:8px;font-size:13px}
  .sheet2 button{border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:600}
  /* Impresión / PDF */
  @media print{
    @page{size:A4;margin:12mm}
    body{background:#fff}
    #bar,#status,#toast,#modal,.leaflet-control-container{display:none!important}
    #compass{display:none!important}
    #map{position:relative!important;width:100%!important;height:120mm!important;border:1px solid #999;page-break-inside:avoid}
    #report{display:block;font-size:11pt}
    #report h1{font-size:18pt;margin:0 0 4mm}
    #report table{width:100%;border-collapse:collapse;margin-top:4mm}
    #report th,#report td{border:1px solid #bbb;padding:2mm;text-align:left;vertical-align:top}
    #report th{background:#eee}
    #report tr{page-break-inside:avoid}
    .trail-pane{opacity:.45}
  }
</style>
</head>
<body>
<div id="report"></div>
<div id="map"></div>

<div id="compass" class="panel">
  <svg id="rose" viewBox="-50 -50 100 100">
    <circle r="47" fill="#fff" stroke="#2b3a2c" stroke-width="3"/>
    <g id="roseG">
      <polygon points="0,-40 9,0 -9,0" fill="#c8553d"/>
      <polygon points="0,40 9,0 -9,0" fill="#2b3a2c"/>
    </g>
  </svg>
  <div id="coords">--.-----° N<br>--.-----° O<br><small id="hdg">Rumbo --</small></div>
</div>
<div id="status" class="panel"><span id="st">Buscando GPS…</span><br><span id="stats">0 m · 0 🍄</span></div>
<div id="carChip" class="panel"><svg viewBox="0 0 40 40" id="carArrow"><path d="M20 4 L31 32 L20 25 L9 32 Z" fill="#c8553d" stroke="#fff" stroke-width="2"/></svg><span id="carTxt">🚗 --</span></div>
<div id="toast"></div>

<div id="bar">
  <button id="bRec" class="on">⏸ Pausar</button>
  <button id="bSeta">🍄 Añadir</button>
  <button id="bFollow" class="on">🎯 Seguir</button>
  <button id="bMap">🛰 Capa</button>
  <button id="bPdf">📄 PDF</button>
  <button id="bMore">☰ Menú</button>
</div>

<div id="modal"><div id="sheet">
  <h3 id="mTitle">Nueva seta</h3>
  <label for="mSpecies">Especie</label>
  <select id="mSpecies"></select>
  <div id="otherWrap" style="display:none">
    <label for="mOther">Nombre de la seta</label>
    <input id="mOther" placeholder="Escribe la especie">
  </div>
  <label for="mQty">Cantidad (unidades)</label>
  <input id="mQty" type="number" min="1" step="1" inputmode="numeric" value="1">
  <label for="mDate">Fecha y hora de recogida</label>
  <input id="mDate" type="datetime-local">
  <label for="mNote">Notas (opcional)</label>
  <input id="mNote" placeholder="Cantidad, estado, árbol cercano…">
  <label>Ubicación</label>
  <div class="meta" id="mLoc"></div>
  <button class="bNo" id="mMove" style="width:100%;margin-top:8px;border:0;border-radius:12px;padding:10px;font-size:14px;font-weight:600">📍 Cambiar posición en el mapa</button>
  <div class="row">
    <button class="bDel" id="mDel">Borrar</button>
    <button class="bNo" id="mCancel">Cancelar</button>
    <button class="bOk" id="mSave">Guardar</button>
  </div>
</div></div>

<div id="menuModal" class="mModal"><div class="sheet2">
  <h3>Menú</h3>
  <div class="col">
    <button class="bOk" id="uStats">📊 Estadísticas de la salida</button>
    <button class="bOk" id="uCar">🚗 Marcar el coche aquí</button>
    <button class="bOk" id="uNew">➕ Empezar nueva salida</button>
    <button class="bNo" id="uHist">🗂 Mis salidas</button>
    <div style="display:flex;gap:8px"><button class="bNo" id="uExp" style="flex:1">⬇ Exportar</button><button class="bNo" id="uImp" style="flex:1">⬆ Importar</button></div>
    <button class="bDel" id="uClear">🧹 Borrar rastro de esta salida</button>
    <button class="bNo" id="uClose">Cerrar</button>
  </div>
</div></div>
<div id="statsModal" class="mModal"><div class="sheet2">
  <h3>📊 Estadísticas</h3>
  <div id="statsBody"></div>
  <div class="col" style="margin-top:12px"><button class="bNo" onclick="this.closest('.mModal').classList.remove('show')">Cerrar</button></div>
</div></div>
<div id="histModal" class="mModal"><div class="sheet2">
  <h3>🗂 Mis salidas</h3>
  <div id="histList" style="max-height:55vh;overflow:auto"></div>
  <div class="col" style="margin-top:12px"><button class="bNo" onclick="this.closest('.mModal').classList.remove('show')">Cerrar</button></div>
</div></div>
<div id="pdfModal" class="mModal"><div class="sheet2">
  <h3>📄 Informe de la salida</h3>
  <p id="pdfMsg"></p>
  <div id="pdfBtns" class="col">
    <button class="bOk" id="pShare">📤 Compartir PDF (WhatsApp, correo…)</button>
    <button class="bOk" id="pWa" style="background:#25d366">💬 Enviar resumen por WhatsApp</button>
    <button class="bNo" id="pOpen">👁 Abrir / imprimir PDF</button>
    <button class="bNo" id="pDown">⬇ Descargar PDF</button>
    <button class="bNo" id="pClose">Cerrar</button>
  </div>
</div></div>

<script>
const RADIUS = 1.5, MIN_STEP = 0.75, MAX_ACC = 25, KEY = 'buscasetas_v1';
const SPECIES = [
  'Boletus edulis (andoa, boleto)',
  'Boletus aereus (boleto negro)',
  'Boletus pinophilus (boleto de pino)',
  'Cantharellus cibarius (rebozuelo, cantarela)',
  'Macrolepiota procera (parasol, zarrota)',
  'Lactarius deliciosus (níscalo)',
  'Amanita caesarea (amanita de los Césares)',
  'Lepista nuda (pie azul)',
  'Hydnum repandum (lengua de vaca)',
  'Craterellus cornucopioides (trompeta de los muertos)'
];
const $ = id => document.getElementById(id);
const esc = s => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const KEY2 = 'rastroseta_v2';
const newSession = () => ({id:Date.now(), start:Date.now(), lastT:null, trail:[], setas:[], car:null, dist:0, gain:0, movingMs:0});
let store = null;
try { const s = localStorage.getItem(KEY2); if (s) store = JSON.parse(s); } catch(e){}
if (!store) {  // migrar datos de la versión anterior
  const first = newSession();
  try { const old = JSON.parse(localStorage.getItem(KEY) || 'null'); if (old) { first.trail = old.trail || []; first.setas = old.setas || [];
    if (first.setas.length) first.start = Math.min(...first.setas.map(x=>x.t)); } } catch(e){}
  store = {current:first.id, sessions:[first]};
}
store.sessions.forEach(ss => ss.setas.forEach(x => { if (!x.species) { x.species = x.note || 'Sin especificar'; x.note = ''; } if (!x.qty) x.qty = 1; }));
let data = store.sessions.find(x => x.id === store.current) || store.sessions[store.sessions.length-1];
const clean = ss => ({...ss, setas: ss.setas.map(({_m,...r})=>r)});
const fmtDist = m => m < 1000 ? `${Math.round(m)} m` : `${(m/1000).toFixed(2).replace('.',',')} km`;
const persist = () => {
  try { localStorage.setItem(KEY2, JSON.stringify({current:data.id, sessions:store.sessions.map(clean)})); } catch(e){ toast && toast('⚠ No se pudo guardar'); }
  $('stats').textContent = `${fmtDist(data.dist||0)} · ${data.setas.reduce((a,x)=>a+(x.qty||1),0)} 🍄`;
};

// ---------- Mapa ----------
const map = L.map('map', {zoomControl:false, maxZoom:21}).setView([42.6,-8.1], 9);
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:21,maxNativeZoom:19,attribution:'© OpenStreetMap',crossOrigin:true});
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:21,maxNativeZoom:19,attribution:'© Esri',crossOrigin:true});
osm.addTo(map); let satOn = false;

map.createPane('trail'); map.getPane('trail').classList.add('trail-pane'); map.getPane('trail').style.zIndex = 390;
const trailRenderer = L.canvas({pane:'trail', padding:0.5});
const trailLayer = L.layerGroup().addTo(map);
const drawPoint = p => L.circle(p, {radius:RADIUS, renderer:trailRenderer, pane:'trail', stroke:false, fillColor:'#2ee65a', fillOpacity:1, interactive:false}).addTo(trailLayer);
data.trail.forEach(drawPoint);

// ---------- Setas ----------
const fmtDate = t => new Date(t).toLocaleString('es-ES', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const fmtLat = v => `${Math.abs(v).toFixed(5)}° ${v>=0?'N':'S'}`;
const fmtLng = v => `${Math.abs(v).toFixed(5)}° ${v>=0?'E':'O'}`;
const setaIcon = n => L.divIcon({className:'', html:`<div class="seta">🍄<b>${n}</b></div>`, iconSize:[28,28], iconAnchor:[14,24]});
function refreshSetaMarkers(){
  data.setas.sort((a,b)=>a.t-b.t);
  data.setas.forEach((s,i) => {
    if (!s._m) { s._m = L.marker([s.lat,s.lng]).addTo(map); s._m.on('click', () => openModal(s)); }
    s._m.setIcon(setaIcon(i+1));
  });
}
refreshSetaMarkers(); persist();

SPECIES.concat(['Otra (escribir)…']).forEach((n,i) => {
  const o = document.createElement('option'); o.value = i < SPECIES.length ? n : '__other'; o.textContent = n; $('mSpecies').appendChild(o);
});
$('mSpecies').onchange = () => { $('otherWrap').style.display = $('mSpecies').value === '__other' ? 'block' : 'none'; };
const toLocalInput = t => { const d = new Date(t); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); };

let editing = null, pending = null;
function openModal(s, latlng){
  editing = s || null; pending = latlng || null;
  const lat = s ? s.lat : latlng.lat, lng = s ? s.lng : latlng.lng, t = s ? s.t : Date.now();
  $('mTitle').textContent = s ? `Seta nº ${data.setas.indexOf(s)+1}` : 'Nueva seta';
  const sp = s ? s.species : SPECIES[0];
  if (SPECIES.includes(sp)) { $('mSpecies').value = sp; $('mOther').value = ''; }
  else { $('mSpecies').value = '__other'; $('mOther').value = sp || ''; }
  $('mSpecies').onchange();
  $('mDate').value = toLocalInput(t);
  $('mNote').value = s ? (s.note||'') : '';
  $('mQty').value = s ? (s.qty||1) : 1;
  $('mLoc').innerHTML = `${fmtLat(lat)} · ${fmtLng(lng)}<br>${s ? 'Recogida el ' + fmtDate(s.t) : 'Ahora: ' + fmtDate(t)}`;
  $('mDel').style.display = s ? 'block' : 'none';
  $('modal').classList.add('show');
}
// Cambiar la posición: se cierra la ficha y el siguiente toque en el mapa la recoloca
let moving = null;
$('mMove').onclick = () => {
  moving = {s:editing, draft:{species:$('mSpecies').value, other:$('mOther').value, date:$('mDate').value, note:$('mNote').value, qty:$('mQty').value}};
  $('modal').classList.remove('show'); setAdd(true); $('bSeta').textContent = 'Toca la nueva posición';
};
function restoreDraft(d){ $('mSpecies').value = d.species; $('mOther').value = d.other; $('mSpecies').onchange(); $('mDate').value = d.date; $('mNote').value = d.note; $('mQty').value = d.qty; }
const closeModal = () => { $('modal').classList.remove('show'); editing = pending = null; };
$('mCancel').onclick = closeModal;
$('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
$('mSave').onclick = () => {
  let species = $('mSpecies').value === '__other' ? $('mOther').value.trim() : $('mSpecies').value;
  if (!species) { $('mOther').focus(); return; }
  const t = $('mDate').value ? new Date($('mDate').value).getTime() : Date.now();
  const qty = Math.max(1, parseInt($('mQty').value) || 1);
  if (editing) Object.assign(editing, {species, t, qty, note:$('mNote').value.trim()});
  else data.setas.push({lat:+pending.lat.toFixed(7), lng:+pending.lng.toFixed(7), t, qty, species, note:$('mNote').value.trim()});
  refreshSetaMarkers(); persist(); closeModal(); setAdd(false);
};
$('mDel').onclick = () => {
  if (!editing || !confirm('¿Borrar esta seta?')) return;
  map.removeLayer(editing._m); data.setas.splice(data.setas.indexOf(editing),1);
  refreshSetaMarkers(); persist(); closeModal();
};

// ---------- Posición, flecha y brújula ----------
let statPos = null, prevFix = null, baseAlt = null;
let recording = true, follow = true, addMode = false, me = null, accCircle = null, last = null;
let shown = null, filt = null, anim = null, lastFixT = 0, targetHeading = null, shownHeading = null;
function frame(){
  if (anim && me){
    const f = Math.min(1, (performance.now() - anim.t0) / anim.dur), e = f*(2-f);
    shown = {lat: anim.from.lat + (anim.to.lat-anim.from.lat)*e, lng: anim.from.lng + (anim.to.lng-anim.from.lng)*e};
    me.setLatLng(shown); accCircle.setLatLng(shown);
    if (follow && !userTouching) map.setView(shown, map.getZoom(), {animate:false});
    if (f >= 1) anim = null;
  }
  if (targetHeading != null){
    if (shownHeading == null) shownHeading = targetHeading;
    const d = ((targetHeading - shownHeading + 540) % 360) - 180;   // giro por el camino más corto
    shownHeading = (shownHeading + d*0.15 + 360) % 360;
    const svg = $('arrowSvg'); if (svg) svg.style.transform = `rotate(${shownHeading}deg)`;
  }
  requestAnimationFrame(frame);
}
let userTouching = false, targetRose = null, shownRose = null;
(function roseFrame(){
  if (targetRose != null){
    if (shownRose == null) shownRose = targetRose;
    const d = ((targetRose - shownRose + 540) % 360) - 180;
    shownRose = (shownRose + d*0.2 + 360) % 360;
    $('roseG').setAttribute('transform', `rotate(${-shownRose})`);
  }
  requestAnimationFrame(roseFrame);
})();
requestAnimationFrame(frame);
let moveHeading = null, compassHeading = null, lastHeadPos = null;
const arrowHtml = `<svg class="arrow" id="arrowSvg" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="rgba(42,125,225,.18)"/><path d="M20 3 L32 33 L20 26 L8 33 Z" fill="#2a7de1" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
const meIcon = L.divIcon({className:'', html:arrowHtml, iconSize:[34,34], iconAnchor:[17,17]});
const cardinal = h => ['N','NE','E','SE','S','SO','O','NO'][Math.round(h/45)%8];
function updateHeading(){
  const h = moveHeading ?? compassHeading;  // caminando: rumbo GPS; parado: brújula
  if (h != null) targetHeading = h;
  updateCar();
  const dev = compassHeading ?? moveHeading;   // la aguja usa la orientación real del móvil
  if (dev != null) targetRose = dev;
  if (h != null) {
    $('hdg').textContent = `Rumbo ${Math.round(h)}° ${cardinal(h)}`;
  }
}
// Las letras N de la rosa giran con ella
$('roseG').insertAdjacentHTML('beforeend','<text y="-28" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" style="paint-order:stroke" stroke="#c8553d" stroke-width="0">N</text>');

function bearing(a, b){
  const r = Math.PI/180, y = Math.sin((b.lng-a.lng)*r)*Math.cos(b.lat*r),
        x = Math.cos(a.lat*r)*Math.sin(b.lat*r) - Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lng-a.lng)*r);
  return (Math.atan2(y,x)/r + 360) % 360;
}

function onPos(pos){
  const {latitude:lat, longitude:lng, accuracy:acc, heading, speed} = pos.coords;
  const ll = L.latLng(lat,lng);
  if (!me){
    me = L.marker(ll,{icon:meIcon, zIndexOffset:1000, interactive:false}).addTo(map);
    accCircle = L.circle(ll,{radius:acc, color:'#2a7de1', weight:1, fillOpacity:.06, interactive:false}).addTo(map);
    map.setView(ll, 19); shown = {lat, lng}; filt = {lat, lng};
  }
  accCircle.setRadius(acc);
  // Suavizado: filtra el temblor del GPS y anima hasta la nueva posición
  const now = performance.now();
  const k = Math.min(1, Math.max(.35, 8 / Math.max(acc, 1)));   // más preciso = más peso
  filt = {lat: filt.lat + (lat - filt.lat)*k, lng: filt.lng + (lng - filt.lng)*k};
  const dt = lastFixT ? now - lastFixT : 1000; lastFixT = now;
  anim = {from:{...shown}, to:{...filt}, t0:now, dur:Math.min(1500, Math.max(300, dt*0.95))};
  $('coords').innerHTML = `${fmtLat(lat)}<br>${fmtLng(lng)}<br><small id="hdg">${$('hdg').textContent}</small>`;
  // Rumbo de marcha
  if (heading != null && !isNaN(heading) && speed > 0.4) moveHeading = heading;
  else if (lastHeadPos && lastHeadPos.distanceTo(ll) > Math.max(3, acc/2)) { moveHeading = bearing(lastHeadPos, ll); lastHeadPos = ll; }
  else if (speed != null && speed < 0.2) moveHeading = null;
  if (!lastHeadPos) lastHeadPos = ll;
  updateHeading();
  $('st').textContent = acc > MAX_ACC ? `GPS impreciso ±${Math.round(acc)} m` : `GPS ±${Math.round(acc)} m · ${recording?'grabando':'pausado'}`;
  if (recording && acc <= MAX_ACC) {

    if (statPos) { const d = statPos.distanceTo(ll); if (d >= Math.max(2, acc/4)) { data.dist += d; statPos = ll; } } else statPos = ll;
    if (data.lastT && now - data.lastT < 30000 && (speed > 0.3 || (prevFix && prevFix.distanceTo(ll) > 0.5))) data.movingMs += now - data.lastT;
    data.lastT = now; prevFix = ll;

      else if (baseAlt - alt > 3) baseAlt = alt;

  if (last){
    const d = last.distanceTo(ll);

    if (d < 30){ const n = Math.floor(d / MIN_STEP);
      for (let i=1;i<n;i++){ const f=i/n; const p=[+(last.lat+(lat-last.lat)*f).toFixed(7), +(last.lng+(lng-last.lng)*f).toFixed(7)]; data.trail.push(p); drawPoint(p); } }

}

// Brújula del dispositivo
function onOrient(e){
  let h = null;
  if (e.webkitCompassHeading != null) h = e.webkitCompassHeading;
  else if (e.absolute && e.alpha != null) h = 360 - e.alpha;
  if (h == null) return;
  const so = (screen.orientation && screen.orientation.angle) || 0;
  compassHeading = (h + so + 360) % 360; updateHeading();
}

function enableCompass(){
  if (orientOn) return;
  const start = () => { orientOn = true;
    window.addEventListener('deviceorientationabsolute', onOrient, true);
    window.addEventListener('deviceorientation', onOrient, true); };
  if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function')
    DeviceOrientationEvent.requestPermission().then(r => { if (r === 'granted') start(); }).catch(()=>{});
  else start();
}

const TS = 256;
const projX = (lng, z) => (lng + 180) / 360 * TS * 2**z;
const projY = (lat, z) => { const r = lat*Math.PI/180; return (1 - Math.log(Math.tan(r) + 1/Math.cos(r)) / Math.PI) / 2 * TS * 2**z; };
const loadImg = src => new Promise(ok => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });

async function renderMapImage(W, H){
  const pts = data.trail.map(p=>({lat:p[0],lng:p[1]})).concat(data.setas.map(s=>({lat:s.lat,lng:s.lng})));
  let minLa=Math.min(...pts.map(p=>p.lat)), maxLa=Math.max(...pts.map(p=>p.lat)), minLo=Math.min(...pts.map(p=>p.lng)), maxLo=Math.max(...pts.map(p=>p.lng));
  const pad = 60; let z = 19;
  while (z > 3 && (projX(maxLo,z)-projX(minLo,z) > W-2*pad || projY(minLa,z)-projY(maxLa,z) > H-2*pad)) z--;
  const cx = (projX(minLo,z)+projX(maxLo,z))/2, cy = (projY(minLa,z)+projY(maxLa,z))/2;
  const ox = cx - W/2, oy = cy - H/2;
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  g.fillStyle = '#e8e4da'; g.fillRect(0,0,W,H);
  const jobs = [];
  for (let tx = Math.floor(ox/TS); tx <= Math.floor((ox+W)/TS); tx++)
    for (let ty = Math.floor(oy/TS); ty <= Math.floor((oy+H)/TS); ty++) {
      const url = satOn ? `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${ty}/${tx}`
                        : `https://${'abc'[(tx+ty)%3]}.tile.openstreetmap.org/${z}/${tx}/${ty}.png`;
      jobs.push(loadImg(url).then(img => { if (img) g.drawImage(img, tx*TS-ox, ty*TS-oy); }));
    }
  await Promise.all(jobs);
  // Rastro
  const t = document.createElement('canvas'); t.width = W; t.height = H; const tg = t.getContext('2d'); tg.fillStyle = '#2ee65a';
  data.trail.forEach(p => { const mpp = 156543.03*Math.cos(p[0]*Math.PI/180)/2**z, r = Math.max(2, RADIUS/mpp);
    tg.beginPath(); tg.arc(projX(p[1],z)-ox, projY(p[0],z)-oy, r, 0, 7); tg.fill(); });
  g.globalAlpha = .55; g.drawImage(t,0,0); g.globalAlpha = 1;
  // Setas numeradas
  data.setas.forEach((s,i) => { const x = projX(s.lng,z)-ox, y = projY(s.lat,z)-oy;
    g.beginPath(); g.arc(x,y,15,0,7); g.fillStyle = '#c8553d'; g.fill(); g.lineWidth = 3; g.strokeStyle = '#fff'; g.stroke();
    g.fillStyle = '#fff'; g.font = 'bold 15px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(i+1, x, y+1); });
  g.fillStyle = 'rgba(255,255,255,.8)'; g.fillRect(W-230,H-22,230,22); g.fillStyle = '#333'; g.font = '12px sans-serif'; g.textAlign='right';
  g.fillText(satOn ? '© Esri World Imagery' : '© colaboradores de OpenStreetMap', W-8, H-10);
  return c.toDataURL('image/jpeg', .85);
}

const pdfDate = t => new Date(t).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
async function buildPdf(){
  const {jsPDF} = await loadJsPDF();
  const img = await renderMapImage(1600, 1100);
  const doc = new jsPDF({unit:'mm', format:'a4'}); const M = 12, PW = 210 - 2*M;
  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(43,58,44); doc.text('Rastro Seta - informe de salida', M, 18);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(60);
  const times = data.setas.map(s=>s.t), area = Math.round(data.trail.length * MIN_STEP * RADIUS * 2);
  let y = 25;
  doc.text(`Generado el ${pdfDate(Date.now())}`, M, y); y += 5;
  if (times.length) { doc.text(`Setas recogidas entre ${pdfDate(Math.min(...times))} y ${pdfDate(Math.max(...times))}`, M, y); y += 5; }
  const st = statsOf(data);
  doc.text(`Distancia: ${fmtDist(st.dist)}   ·   Tiempo: ${fmtDur(st.total)} (${fmtDur(st.moving)} en movimiento)   ·   Desnivel: +${st.gain} m`, M, y); y += 5;
  doc.text(`Zona rastreada aprox.: ${area} m2   ·   Setas: ${st.units} en ${st.spots} puntos`, M, y); y += 4;
  const ih = PW * 1100/1600; doc.addImage(img, 'JPEG', M, y, PW, ih); doc.setDrawColor(150); doc.rect(M, y, PW, ih); y += ih + 7;
  if (data.setas.length) {
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(43,58,44); doc.text('Resumen por especie', M, y); y += 5;
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(40);
    speciesCounts(data).forEach(([k,v]) => { if (y > 280) { doc.addPage(); y = 18; } doc.text(`- ${k}: ${v}`, M+2, y); y += 5; });
    y += 4;
    const cols = [[M,'Nº',10],[M+10,'Especie',62],[M+72,'Fecha y hora',32],[M+104,'Ubicación',40],[M+144,'Notas',42]];
    const header = () => { doc.setFillColor(233,226,208); doc.rect(M, y-4.5, PW, 7, 'F'); doc.setFont('helvetica','bold'); doc.setFontSize(9);
      cols.forEach(([x,t]) => doc.text(t, x+1.5, y)); y += 6; doc.setFont('helvetica','normal'); };
    if (y > 260) { doc.addPage(); y = 18; }
    header();
    data.setas.forEach((s,i) => {
      const cells = [String(i+1), doc.splitTextToSize(s.species + ((s.qty||1) > 1 ? ` (x${s.qty})` : ''), 59), pdfDate(s.t), [fmtLat(s.lat), fmtLng(s.lng)], doc.splitTextToSize(s.note||'', 40)];
      const h = Math.max(...cells.map(c => Array.isArray(c) ? c.length : 1)) * 4 + 2;
      if (y + h > 285) { doc.addPage(); y = 18; header(); }
      cols.forEach(([x,,w],j) => doc.text(cells[j], x+1.5, y));
      doc.setDrawColor(200); doc.line(M, y+h-3.5, M+PW, y+h-3.5); y += h;
    });
  } else { doc.text('No se registraron setas en esta salida.', M, y); }
  return doc.output('blob');
}

$('pWa').onclick = () => { window.open('https://wa.me/?text=' + encodeURIComponent(summaryText()), '_blank'); };
$('pClose').onclick = () => $('pdfModal').classList.remove('show');
$('pdfModal').onclick = e => { if (e.target.id === 'pdfModal') $('pdfModal').classList.remove('show'); };

// ---------- PWA: actualización automática ----------
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(reg => {
    const check = () => reg.update().catch(()=>{});
    document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible') check(); });
    setInterval(check, 30*60*1000);
  });
  let hadController = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloaded) { hadController = true; return; }
    reloaded = true; try { sessionStorage.setItem('rs_upd','1'); } catch(e){} location.reload();
  });
  try { if (sessionStorage.getItem('rs_upd')) { sessionStorage.removeItem('rs_upd'); toast('Nueva versión instalada ✓'); } } catch(e){}
}
</script>
